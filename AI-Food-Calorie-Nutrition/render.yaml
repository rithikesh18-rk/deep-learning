services:
  - type: web
    name: ai-food-calorie-nutrition
    env: python
    rootDir: AI-Food-Calorie-Nutrition
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 1 --threads 2 --timeout 120 --keep-alive 5
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
