project_name: "DefectGuard"
version: "0.1.0"

dataset:
  name: "mvtec_ad"
  category: "bottle"
  root_dir: "./data/bottle"
  train_dir: "./data/bottle/train/good"
  test_dir: "./data/bottle/test"
  ground_truth_dir: "./data/bottle/ground_truth"
  image_size: [224, 224]

model:
  backbone: "wide_resnet50_2"
  layers: ["layer2", "layer3"]
  coreset_sampling_ratio: 0.01
  device: "cpu"  # or "cuda" if GPU is available

api:
  host: "0.0.0.0"
  port: 8000
